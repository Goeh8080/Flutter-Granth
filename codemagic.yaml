workflows:
  admin-app:
    name: Admin App
    max_build_duration: 30
    environment:
      flutter: stable
      vars:
        PROJECT_DIR: admin_app
    scripts:
      - name: Get Flutter packages
        script: |
          cd $PROJECT_DIR
          flutter pub get
      - name: Build APK
        script: |
          cd $PROJECT_DIR
          flutter build apk --release
    artifacts:
      - admin_app/build/app/outputs/flutter-apk/*.apk

  viewer-app:
    name: Viewer App
    max_build_duration: 30
    environment:
      flutter: stable
      vars:
        PROJECT_DIR: viewer_app
    scripts:
      - name: Get Flutter packages
        script: |
          cd $PROJECT_DIR
          flutter pub get
      - name: Build APK
        script: |
          cd $PROJECT_DIR
          flutter build apk --release
    artifacts:
      - viewer_app/build/app/outputs/flutter-apk/*.apk
