name: Android APK (Flutter)

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      # APP_KEY (optional repository secret): the permanent app identifier for the admin dashboard's
      # "verified installs". Without the secret (forks, PRs, not yet added) the build simply has no key.
      - name: Build universal APK
        env:
          APP_KEY: ${{ secrets.APP_KEY }}
        run: |
          set +x
          args=""
          if [ -n "$APP_KEY" ]; then
            printf '{"APP_KEY":"%s"}' "$APP_KEY" > "$RUNNER_TEMP/dd.json"
            args="--dart-define-from-file=$RUNNER_TEMP/dd.json"
          fi
          flutter build apk --release $args
          rm -f "$RUNNER_TEMP/dd.json"
      - name: Kotlin unit tests (PDF notification service)
        working-directory: android
        run: chmod +x gradlew && ./gradlew :app:testDebugUnitTest --console=plain
      - uses: actions/upload-artifact@v4
        with:
          name: granth-flutter-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
      - name: Build arm64 APK
        env:
          APP_KEY: ${{ secrets.APP_KEY }}
        run: |
          set +x
          args=""
          if [ -n "$APP_KEY" ]; then
            printf '{"APP_KEY":"%s"}' "$APP_KEY" > "$RUNNER_TEMP/dd.json"
            args="--dart-define-from-file=$RUNNER_TEMP/dd.json"
          fi
          flutter build apk --release --split-per-abi --target-platform android-arm64 $args
          rm -f "$RUNNER_TEMP/dd.json"
      - uses: actions/upload-artifact@v4
        with:
          name: granth-flutter-apk-arm64
          path: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          if-no-files-found: error
