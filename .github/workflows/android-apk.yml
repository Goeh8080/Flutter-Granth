name: Android APK (Flutter)

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      EXPECTED_SHA256: 68c7cf34ecf0fada2105c265d2595496baa1bbc97c3fddbc35d21dbe8d0eddde
      # Signing + builds only on push to main or manual runs (never on PRs, incl. forks).
      DO_SIGN: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

      - name: Set up signing (keystore, key.properties, google-services.json)
        if: env.DO_SIGN == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          set +x
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/satlok.keystore"
          {
            echo "storeFile=$RUNNER_TEMP/satlok.keystore"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > android/key.properties
          printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json

      - name: Build universal APK, arm64 APK and AAB
        if: env.DO_SIGN == 'true'
        env:
          APP_KEY: ${{ secrets.APP_KEY }}
        run: |
          set +x
          args=""
          if [ -n "$APP_KEY" ]; then
            printf '{"APP_KEY":"%s"}' "$APP_KEY" > "$RUNNER_TEMP/dd.json"
            args="--dart-define-from-file=$RUNNER_TEMP/dd.json"
          fi
          mkdir -p dist
          flutter build apk --release $args
          cp build/app/outputs/flutter-apk/app-release.apk dist/granth-universal.apk
          flutter build apk --release --split-per-abi --target-platform android-arm64 $args
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk dist/granth-arm64-v8a.apk
          flutter build appbundle --release $args
          cp build/app/outputs/bundle/release/app-release.aab dist/granth.aab
          rm -f "$RUNNER_TEMP/dd.json"

      - name: Kotlin unit tests
        if: env.DO_SIGN == 'true'
        working-directory: android
        run: chmod +x gradlew && ./gradlew :app:testDebugUnitTest --console=plain

      - name: Re-sign APKs with v1+v2+v3 and verify
        if: env.DO_SIGN == 'true'
        env:
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASS: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          set +x
          set -euo pipefail
          BT="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          echo "Using build-tools: $BT"
          # apksigner skips v1 when the APK's minSdk is >= 24; --min-sdk-version 23 (signing tool only,
          # the app's minSdk is unchanged) makes it add and check the v1 JAR signature too.
          for apk in dist/granth-universal.apk dist/granth-arm64-v8a.apk; do
            if ! "$BT/zipalign" -c -p 4 "$apk"; then
              "$BT/zipalign" -f -p 4 "$apk" "$apk.aligned" && mv "$apk.aligned" "$apk"
            fi
            "$BT/apksigner" sign --ks "$RUNNER_TEMP/satlok.keystore" --ks-pass env:KS_PASS \
              --ks-key-alias "$KEY_ALIAS" --key-pass env:KEY_PASS \
              --min-sdk-version 23 --v1-signing-enabled true --v2-signing-enabled true --v3-signing-enabled true "$apk"
            rm -f "$apk.idsig"
            out="$("$BT/apksigner" verify -v --min-sdk-version 23 --print-certs "$apk")"
            echo "== $apk"; echo "$out" | grep -E "Verified using v[123] scheme|SHA-256 digest"
            for v in 1 2 3; do
              echo "$out" | grep -q "Verified using v$v scheme (APK Signature Scheme v$v): true" \
                || { echo "::error::$apk: v$v signing not verified"; exit 1; }
            done
            echo "$out" | grep -q "certificate SHA-256 digest: $EXPECTED_SHA256" \
              || { echo "::error::$apk: certificate SHA-256 mismatch"; exit 1; }
          done
          keytool -printcert -jarfile dist/granth.aab | tr -d ':' | tr 'A-F' 'a-f' | grep -q "sha256 $EXPECTED_SHA256" \
            || { echo "::error::AAB certificate SHA-256 mismatch"; exit 1; }
          echo "AAB certificate SHA-256 matches"

      - name: Play Console checks on the AAB
        if: env.DO_SIGN == 'true'
        run: |
          set -euo pipefail
          AAB=dist/granth.aab
          fail(){ echo "::error::$1"; exit 1; }
          # 1) Signed with the Satlok key
          jarsigner -verify "$AAB" | grep -q "jar verified" || fail "AAB jarsigner -verify failed"
          echo "jarsigner: jar verified"
          keytool -printcert -jarfile "$AAB" | tr -d ':' | tr 'A-F' 'a-f' | grep -q "sha256 $EXPECTED_SHA256" \
            || fail "AAB certificate SHA-256 mismatch"
          echo "AAB cert SHA-256 matches $EXPECTED_SHA256"
          # Merged manifest via bundletool
          curl -sSfL -o "$RUNNER_TEMP/bundletool.jar" https://github.com/google/bundletool/releases/download/1.17.2/bundletool-all-1.17.2.jar
          java -jar "$RUNNER_TEMP/bundletool.jar" dump manifest --bundle "$AAB" > "$RUNNER_TEMP/manifest.xml"
          M="$RUNNER_TEMP/manifest.xml"
          tsdk=$(grep -oP 'android:targetSdkVersion="\K[0-9]+' "$M" | head -1)
          vc=$(grep -oP 'android:versionCode="\K[0-9]+' "$M" | head -1)
          vn=$(grep -oP 'android:versionName="\K[^"]+' "$M" | head -1)
          echo "targetSdk=$tsdk versionCode=$vc versionName=$vn"
          [ "${tsdk:-0}" -ge 35 ] || fail "targetSdk $tsdk < 35"
          [ "$vc" = "1" ] || fail "versionCode $vc != 1"
          [ "$vn" = "1.0.0" ] || fail "versionName $vn != 1.0.0"
          if grep -E 'uses-permission[^>]*(AD_ID|ACCESS_ADSERVICES_)' "$M"; then fail "AD_ID / ADSERVICES permission in merged manifest"; fi
          echo "no AD_ID / ACCESS_ADSERVICES_* permissions"
          if grep -q 'android:debuggable="true"' "$M"; then fail "debuggable=true in manifest"; fi
          echo "not debuggable"
          # 16 KB page alignment of every 64-bit native library (Play requirement) (all LOAD segments p_align >= 0x4000)
          rm -rf "$RUNNER_TEMP/aablib"; mkdir -p "$RUNNER_TEMP/aablib"
          unzip -q "$AAB" 'base/lib/*' -d "$RUNNER_TEMP/aablib" || true
          n=0
          while IFS= read -r so; do
            n=$((n+1))
            bad=$(readelf -lW "$so" | awk '$1=="LOAD"{a=strtonum($NF); if (a<16384) print $NF}')
            [ -z "$bad" ] || fail "$(basename "$so") not 16KB aligned ($bad)"
          done < <(find "$RUNNER_TEMP/aablib" -name '*.so' \( -path '*/arm64-v8a/*' -o -path '*/x86_64/*' \))
          [ "$n" -gt 0 ] || fail "no native libraries found in AAB"
          echo "all $n native libraries are 16KB page aligned"

      - uses: actions/upload-artifact@v4
        if: env.DO_SIGN == 'true'
        with:
          name: granth-flutter-apk
          path: dist/granth-universal.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: env.DO_SIGN == 'true'
        with:
          name: granth-flutter-apk-arm64
          path: dist/granth-arm64-v8a.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: env.DO_SIGN == 'true'
        with:
          name: granth-flutter-aab
          path: dist/granth.aab
          if-no-files-found: error

      - name: Remove signing material
        if: always()
        run: rm -f android/key.properties android/app/google-services.json "$RUNNER_TEMP/satlok.keystore" "$RUNNER_TEMP/dd.json"
